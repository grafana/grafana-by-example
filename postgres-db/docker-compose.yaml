version: "3.9"

services:

  # https://hub.docker.com/_/postgres
  postgres-server:
    image: postgres:latest@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=welcome1 
    volumes:
      - "./dvdrental.tar:/dvdrental.tar"
      - "./ctl.sh:/ctl.sh"
      - "./postgres/postgresql.conf:/postgresql.conf"
      - "./logs/:/var/log/postgresql/"
    entrypoint:
      - "/ctl.sh"
      - "run"
      #- "sleep"


  # https://www.adminer.org/
  # Login localhost:8080 PostgreSQL / postgres-server / postgres / welcome1
  adminer:
    image: adminer@sha256:b87a22863ed8c18437c7241a5d39ae2e05669d4d2eb9d78591d5087a09258bc8
    restart: always
    ports:
      - 8080:8080

  # Generate Prometheues Metrics from PostgresSQL
  # https://github.com/prometheus/client_python
  postgres-metrics:
    image: postgres-metrics/postgres-metrics
    build: ./postgres-metrics
    deploy:
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 3600
        window: 30s
    environment:
      - PROMTHEUS_HTTP_PORT=8001
    ports:
      - "8001:8001"
    command: [ "7200", "60", "15", "postgres-server" ]

  # Grafana Agent
  # https://grafana.com/docs/agent/latest/
  grafana-agent:
    image: grafana/agent:latest@sha256:473928c1cace5a23fdb1c187dba4ec0fe733d4627ae65383861a7beb997db88c
    ports:
      - "12345:12345"
      - "12346:12346"
    volumes:
      - "./configured-config-cloud.yaml:/etc/agent/agent.yaml"
      - "./logs/:/logs"
    command: [ "-config.file=/etc/agent/agent.yaml" ]