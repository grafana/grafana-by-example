version: "3.9"

services:

  grafana-pdc-agent:
    image: grafana/pdc-agent:latest@sha256:e17e65368ca5d8267e8996030869c5cf1b6929e0344e08e90eef6e1179172601
    #entrypoint: [ /usr/bin/pdc  ]
    command: [ -token, $GRAFANA_CLOUD_PDC_TOKEN,
               -cluster, $GRAFANA_CLOUD_PDC_CLUSTER,
               -gcloud-hosted-grafana-id, $GRAFANA_CLOUD_PDC_ID ]

    #           -domain, $GRAFANA_CLOUD_PDC_DOMAIN ]

  # https://hub.docker.com/_/postgres
  postgres-server:
    image: postgres:latest@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    depends_on:
      - grafana-pdc-agent
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=welcome1 
    volumes:
      - "./dvdrental.tar:/dvdrental.tar"
      - "./ctl.sh:/ctl.sh"
      - "./sql-test1.sql:/sql-test1.sql"
      - "./postgres/postgresql.conf:/postgresql.conf"
      #- "./logs/:/var/log/postgresql/"
    entrypoint: [ ./ctl.sh ]
    command: [ run ]
    #command: [ sleep ]
      
  # Grafana Metrics
  mimir:
    image: grafana/mimir:latest@sha256:0ed56db7d7713707eff00224ddd4c3096afa6cf1cbe43a6f9391c537f1416099
    depends_on:
      - grafana-pdc-agent 
    volumes:
      - "./mimir/config-single.yaml:/etc/mimir/config.yaml"
    ports:
      - "9009:9009"
    command: [
      "-config.file=/etc/mimir/config.yaml"
    ]

    # Grafana Agent
  grafana-agent:
    image: grafana/agent:latest@sha256:473928c1cace5a23fdb1c187dba4ec0fe733d4627ae65383861a7beb997db88c
    depends_on:
      - mimir
    ports:
      - "12345:12345"
      - "3500:3500"
      - "16603:16603"
    volumes:
      - "./grafana-agent/config.yaml:/etc/agent/agent.yaml"
    command: [
      "-config.file=/etc/agent/agent.yaml",
      "-server.http.address=0.0.0.0:12345",
    ]


      
