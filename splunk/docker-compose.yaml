version: "3.8"
volumes:
  grafana:

services:

  # Grafana Enterprise
  grafana-server:
    image: grafana/grafana-enterprise@sha256:255cf088bf7ce26f4ce335eb48184b39dbacb7e34c81f4c16552aab433224b66
    container_name: grafana-server
    environment:
      - GF_INSTALL_PLUGINS=grafana-splunk-datasource
    volumes:
      - "./grafana/grafana.ini:/etc/grafana/grafana.ini"
      #- "./grafana/provisioning:/etc/grafana/provisioning"
      - "./ge-license.jwt:/var/lib/grafana/license.jwt"
    ports:
      - "3000:3000"

   # Splunk Enterprise
  splunk-enterprise:
    image: splunk/splunk:latest@sha256:e26840dfe69ec9ff305c10681664900168849c3ff346a9cf49322b5351841f3f
    container_name: splunk-enterprise
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=welcome1
    ports:
      - "8000:8000"
      - "8065:8065"
      - "8088-8089:8088-8089"
      - "8191:8191"
      - "9887:9887"
      - "9997:9997"




 