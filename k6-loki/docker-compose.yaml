version: "3.8"
volumes:
  grafana:
  postgres:

services:

  # Grafana for exploring and visualizing data
  grafana-server:
    image: grafana/grafana-enterprise:latest-ubuntu@sha256:e5c81c010dd45ef7a26da6ecf2a2376316066bcab1131dc6304d4966ba51e4f4
    #image: grafana-enterprise:main-ubuntu
    #image: grafana/grafana:9.0.6-ubuntu
    #image: grafana/grafana:latest
    #image: grafana/grafana:8.2.1
    #image: grafana/grafana:8.5.6
    #restart: always
    volumes:
      - "./grafana/grafana.ini:/etc/grafana/grafana.ini"
      - "./grafana/provisioning:/etc/grafana/provisioning"
      - "/tmp/container-tmp:/tmp/container-tmp"
    ports:
      - "3000:3000"

  # Grafana Metrics
  mimir:
    image: grafana/mimir:latest@sha256:245ce851e2f5d27db6bd37720d9ab12bcb017f4b4e20340d9b58266435dbe4b6
    depends_on:
      - grafana-server
    volumes:
      - "./mimir/config-single.yaml:/etc/mimir/config.yaml"
    ports:
      - "9009:9009"
    command: [
      "-config.file=/etc/mimir/config.yaml"
    ]

  # Grafana logs
  loki:
    image: grafana/loki:latest@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    depends_on:
      - grafana-server
    ports:
      - "3100:3100"
    volumes:
      - "./loki/config.yaml:/etc/loki/local-config.yaml"
  
  # GoLang K6 Container with xk6-loki client
  # https://grafana.com/docs/loki/latest/send-data/k6/
  go-k6:
    image: go-k6:latest
    build: ./go-k6
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - "./k6-scripts/loki1.js:/home/test/loki1.js"
    entrypoint: [ "sleep", "1209600" ]

 